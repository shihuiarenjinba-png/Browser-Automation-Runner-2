name: Browser -2 Windows QA (unsigned EXE only)
on:
  push:
    branches:
      - codex/consumer-v2-initial-20261024
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests-and-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile and run offline unit tests
        run: |
          python -m compileall -q desktop_app.py browser_runner.py guided_config.py guided_steps.py step_builder_panel.py ui_language.py tests
          python -m unittest discover -s tests -v
      - name: Source app self-test (offline)
        run: python desktop_app.py --self-test
      - name: Verify EXE build PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./build_windows.ps1).Path, [ref]$tokens, [ref]$errorsFound)
          if ($errorsFound.Count -gt 0) { throw "PowerShell script parsing failed" }
      - name: Build unsigned EXE with Playwright Chromium for QA
        shell: pwsh
        run: ./build_windows.ps1
      - name: Install Pillow for screenshot evidence
        run: python -m pip install "Pillow>=11,<13"
      - name: Verify three Windows GUI tabs offline
        run: python qa_windows_gui.py --output gui-review-evidence
      - name: Upload Browser -2 GUI screenshots
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: BrowserAutomationRunner2-GUI-QA-Evidence
          path: gui-review-evidence/**
          if-no-files-found: warn
      - name: Upload QA_UNSIGNED development payload (never Store MSIX)
        uses: actions/upload-artifact@v5
        with:
          name: BrowserAutomationRunner2-Windows-QA_UNSIGNED
          path: dist-validation/**
          if-no-files-found: error
